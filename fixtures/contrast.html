<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Contrast test cases</title></head>
<body style="background:#fff;color:#000"><main><h1>Contrast test cases</h1>
<p id="normal-pass" style="color:#000;font-size:16px">Black text on white</p>
<p id="normal-fail" style="color:#777;font-size:16px">Normal text below 4.5 to 1</p>
<p id="large-pass" style="color:#777;font-size:24px">Large text above 3 to 1</p>
<p id="bold-pass" style="color:#777;font-size:18.667px;font-weight:700">Large bold text</p>
<p id="bold-small" style="color:#777;font-size:18.66px;font-weight:700">Bold text below the size boundary</p>
<p id="gradient" style="background:linear-gradient(#fff,#000);color:#777">Gradient needs review</p>
<p id="transparent" style="opacity:.5;color:#000">Transparency needs review</p>
<p id="alpha" style="background:rgba(0,0,0,.2);color:#000">Alpha background needs review</p>
<button id="disabled" disabled>Inactive control</button>
</main></body></html>
